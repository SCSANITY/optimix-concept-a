<!--
  CMS MAPPING
  - Archive copy → ACF Options Page: Product Archive
  - Product categories → hierarchical taxonomy: product_category
  - Category benefits → taxonomy repeater field; current values adapted from the legacy Optimix website and require client review
  - Category image/status → taxonomy term fields
  - Reserved media frame and compact catalogue grid → fixed archive template behavior
-->
<section class="product-directory overflow-hidden" id="products" data-products>
  <div class="product-directory__intro mx-auto max-w-site px-5 py-16 sm:px-8 sm:py-20 lg:px-10 lg:py-24">
    <div class="grid gap-8 lg:grid-cols-12 lg:items-end lg:gap-16" data-reveal>
      <div class="lg:col-span-8">
        <p class="mb-5 flex items-center gap-3 text-xs font-semibold uppercase tracking-[0.16em] text-brand-blue">
          <span class="font-heading text-brand-red">01</span>
          <span class="h-px w-8 bg-ink/20" aria-hidden="true"></span>
          <span data-products-eyebrow></span>
        </p>
        <h2 class="max-w-[850px] font-heading text-[2.3rem] font-bold leading-[1.04] tracking-[-0.04em] text-ink sm:text-5xl lg:text-[4rem]" data-products-title></h2>
      </div>
      <div class="lg:col-span-4">
        <p class="max-w-[520px] text-lg leading-[1.7] text-ink/68" data-products-description></p>
        <p class="mt-6 max-w-[520px] border-l-2 border-brand-red pl-4 text-[10px] font-semibold uppercase leading-[1.6] tracking-[0.13em] text-ink/45" data-products-source></p>
      </div>
    </div>
  </div>

  <div class="product-directory__catalogue mx-auto max-w-site px-5 pb-20 sm:px-8 sm:pb-24 lg:px-10 lg:pb-32" id="product-categories">
    <div class="product-directory__grid" aria-label="Optimix product categories" data-product-list></div>
  </div>
</section>
