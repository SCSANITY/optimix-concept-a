<!--
  CMS MAPPING
  - Eyebrow, title, description, and drawing label → ACF Options Page: Homepage Systems
  - System list → CPT: system (fields: name, description, system_drawing, layers)
  - Technical viewport → Approved system drawing when supplied; current geometry is explicitly non-technical
  - Selector behavior, drawing frame, and responsive layout → Fixed theme template behavior
-->
<section class="system-field scroll-mt-24 overflow-hidden bg-mist py-20 sm:py-24 lg:py-32" id="systems" data-systems>
  <div class="mx-auto max-w-site px-5 sm:px-8 lg:px-10">
    <div class="grid gap-8 lg:grid-cols-12 lg:items-end lg:gap-16" data-reveal>
      <div class="lg:col-span-7">
        <p class="mb-5 flex items-center gap-3 text-xs font-semibold uppercase tracking-[0.16em] text-brand-blue">
          <span class="font-heading text-brand-red">02</span>
          <span class="h-px w-8 bg-ink/20" aria-hidden="true"></span>
          <span data-systems-eyebrow></span>
        </p>
        <h2 class="max-w-[760px] font-heading text-[2.125rem] font-bold leading-[1.12] tracking-[-0.025em] text-ink sm:text-5xl lg:text-[3.25rem]" data-systems-title></h2>
      </div>
      <p class="max-w-[520px] text-lg leading-[1.7] text-ink/70 lg:col-span-5" data-systems-description></p>
    </div>

    <div class="mt-14 grid grid-cols-1 gap-9 lg:mt-20 lg:grid-cols-12 lg:items-stretch lg:gap-0">
      <div class="system-selector min-w-0 lg:col-span-5 lg:py-8 lg:pr-10" data-reveal>
        <div class="system-tablist" role="tablist" aria-label="Optimix system solutions" aria-orientation="vertical" data-system-list></div>
      </div>

      <div class="min-w-0 lg:col-span-7" data-reveal>
        <div class="system-viewport relative min-h-[470px] scroll-mt-24 overflow-hidden sm:min-h-[560px]" id="system-preview" role="tabpanel" aria-live="polite" data-system-preview>
          <div class="system-viewport__grid absolute inset-0" aria-hidden="true"></div>
          <div class="system-viewport__wash absolute inset-0" aria-hidden="true"></div>
          <div class="system-viewport__scan absolute inset-y-0 left-0 w-px" aria-hidden="true"></div>

          <div class="system-viewport__scene absolute inset-x-5 bottom-20 top-36 sm:inset-x-9 sm:bottom-24 sm:top-40" aria-hidden="true" data-system-scene>
            <svg class="h-full w-full" viewBox="0 0 720 380" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="518" cy="184" r="106" class="stroke-white/15" />
              <circle cx="518" cy="184" r="72" class="stroke-white/10" stroke-dasharray="5 8" />
              <path d="M48 310L194 92L376 236L608 60" class="stroke-white/20" />
              <path d="M94 300L232 132L392 256L664 108" class="stroke-brand-blue/80" stroke-width="2" />
              <rect x="238" y="92" width="286" height="196" class="stroke-white/35" />
              <path d="M218 92h-28v196h28M544 92h28v196h-28" class="stroke-white/20" />
              <path d="M238 190h286M381 92v196" class="stroke-white/10" stroke-dasharray="4 7" />
              <circle cx="381" cy="190" r="7" class="fill-brand-red" />
              <path d="M381 167v-22M381 213v22M358 190h-22M404 190h22" class="stroke-brand-red/80" />
              <path d="M46 330h154M572 330h102" class="stroke-white/20" />
            </svg>
          </div>

          <span class="system-viewport__ghost-index absolute right-4 top-24 font-heading font-bold" aria-hidden="true" data-system-ghost-index></span>

          <div class="relative z-10 flex min-h-[470px] flex-col justify-between p-6 sm:min-h-[560px] sm:p-9">
            <div class="flex items-start justify-between gap-5">
              <div class="min-w-0 pr-2">
                <p class="text-[10px] font-semibold uppercase tracking-[0.18em] text-white/55" data-system-drawing-label></p>
                <h3 class="mt-4 max-w-[500px] break-words font-heading text-2xl font-bold leading-[1.18] tracking-[-0.02em] text-white sm:text-[1.875rem]" data-system-preview-name></h3>
              </div>
              <span class="shrink-0 font-heading text-xs font-bold tracking-[0.14em] text-white/60" data-system-preview-index></span>
            </div>

            <div class="flex items-end justify-between gap-6 border-t border-white/20 pt-5">
              <p class="max-w-[360px] text-[10px] font-semibold uppercase leading-[1.5] tracking-[0.16em] text-white/55" data-system-placeholder></p>
              <span class="system-viewport__status shrink-0" aria-hidden="true"><span></span><span></span><span></span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
