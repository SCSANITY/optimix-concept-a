<!--
  CMS MAPPING
  - Product identity, description, uses, benefits, specifications, packshot, and data sheet → CPT: product + ACF fields
  - Product category and family labels → hierarchical product_category taxonomy
  - Related products → taxonomy query excluding the current product
  - Query-string routing is Demo-only; WordPress should use the product permalink
-->
<article class="product-detail" data-product-detail-page>
  <section class="product-detail-hero relative isolate overflow-hidden bg-deep-blue text-white">
    <div class="product-detail-hero__glow absolute inset-0" aria-hidden="true"></div>
    <div class="product-detail-hero__grid absolute inset-0" aria-hidden="true"></div>

    <div class="relative z-10 mx-auto max-w-site px-5 pb-16 pt-10 sm:px-8 sm:pb-20 lg:px-10 lg:pb-24 lg:pt-14">
      <a class="product-category-back" data-product-detail-back>
        <span aria-hidden="true">←</span>
        <span data-product-detail-back-label></span>
      </a>

      <div class="mt-12 grid gap-10 lg:mt-16 lg:grid-cols-12 lg:items-center lg:gap-16">
        <div class="lg:col-span-7" data-reveal>
          <div class="flex flex-wrap items-center gap-3">
            <p class="text-[10px] font-semibold uppercase tracking-[0.17em] text-white/58 sm:text-xs" data-product-detail-family></p>
            <span class="h-1 w-1 rounded-full bg-brand-red" aria-hidden="true"></span>
            <p class="product-detail-badge" data-product-detail-badge></p>
          </div>
          <p class="mt-9 font-heading text-[4.7rem] font-extrabold leading-[0.82] tracking-[-0.075em] text-white sm:text-[7.5rem] lg:text-[9rem]" data-product-detail-code></p>
          <h1 class="mt-7 max-w-[740px] font-heading text-3xl font-bold leading-[1.08] tracking-[-0.035em] text-white sm:text-5xl" data-product-detail-title></h1>
          <p class="mt-5 text-xs font-semibold uppercase tracking-[0.14em] text-cyan-100/70" data-product-detail-standard></p>
          <p class="mt-7 max-w-[680px] text-base leading-[1.75] text-white/68 sm:text-lg" data-product-detail-description></p>

          <div class="mt-10 flex flex-col gap-4 sm:flex-row sm:items-center">
            <a class="product-detail-sheet-link" target="_blank" rel="noopener noreferrer" data-product-detail-sheet>
              <span data-product-detail-sheet-label></span>
              <span aria-hidden="true">↗</span>
            </a>
            <div class="text-[10px] font-medium uppercase tracking-[0.12em] text-white/42">
              <span data-product-detail-source-label></span>
              <span class="mx-1">·</span>
              <span data-product-detail-source></span>
            </div>
          </div>
        </div>

        <figure class="product-detail-packshot lg:col-span-5" data-reveal>
          <div class="product-detail-packshot__corner" aria-hidden="true"></div>
          <img alt="" data-product-detail-image>
          <figcaption>Product image sourced from the Optimix website · original production asset required</figcaption>
        </figure>
      </div>
    </div>
  </section>

  <section class="product-detail-overview bg-paper py-20 sm:py-24 lg:py-32">
    <div class="mx-auto max-w-site px-5 sm:px-8 lg:px-10">
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-brand-red" data-product-detail-overview-eyebrow></p>
      <div class="mt-8 grid gap-12 lg:grid-cols-2 lg:gap-20">
        <section class="product-detail-list-panel" data-reveal>
          <h2 class="font-heading text-3xl font-bold tracking-[-0.035em] text-ink sm:text-4xl" data-product-detail-uses-title></h2>
          <ul class="product-detail-list" data-product-detail-uses></ul>
        </section>
        <section class="product-detail-list-panel" data-reveal>
          <h2 class="font-heading text-3xl font-bold tracking-[-0.035em] text-ink sm:text-4xl" data-product-detail-benefits-title></h2>
          <ul class="product-detail-list" data-product-detail-benefits></ul>
        </section>
      </div>
    </div>
  </section>

  <section class="product-detail-technical py-20 sm:py-24 lg:py-32">
    <div class="mx-auto max-w-site px-5 sm:px-8 lg:px-10">
      <div class="grid gap-8 lg:grid-cols-12 lg:items-end lg:gap-16" data-reveal>
        <div class="lg:col-span-7">
          <p class="text-xs font-semibold uppercase tracking-[0.16em] text-brand-red" data-product-detail-technical-eyebrow></p>
          <h2 class="mt-5 max-w-[680px] font-heading text-[2.25rem] font-bold leading-[1.06] tracking-[-0.04em] text-ink sm:text-5xl lg:text-[3.7rem]" data-product-detail-technical-title></h2>
        </div>
        <p class="max-w-[520px] text-base leading-[1.7] text-ink/65 lg:col-span-5" data-product-detail-technical-description></p>
      </div>

      <dl class="product-detail-metrics mt-12" data-product-detail-metrics data-reveal></dl>
    </div>
  </section>

  <section class="product-detail-related bg-paper py-20 sm:py-24 lg:py-28" data-product-detail-related-section>
    <div class="mx-auto max-w-site px-5 sm:px-8 lg:px-10">
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-brand-red" data-product-detail-related-eyebrow></p>
      <h2 class="mt-5 font-heading text-3xl font-bold tracking-[-0.035em] text-ink sm:text-5xl" data-product-detail-related-title></h2>
      <div class="mt-10 grid gap-px bg-ink/15 md:grid-cols-2" data-product-detail-related></div>
    </div>
  </section>
</article>
