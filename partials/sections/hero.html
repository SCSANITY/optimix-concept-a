<!--
  CMS MAPPING
  - Copy and CTA labels → ACF Options Page: Homepage Hero
  - Hero loop, poster and full film → WordPress media fields
  - Editorial composition and media behaviour → Fixed theme template behavior

  PRODUCTION NOTE
  - The supplied 03:43 corporate film remains available on demand.
  - The background uses a derived 19-second, muted loop to protect first-load performance.
  - Request the original 1080p master before production launch when available.
-->
<section
  class="hero-shell relative isolate -mt-20 flex min-h-[100svh] overflow-hidden bg-deep-blue pt-20 text-white"
  id="hero"
  data-hero
>
  <video
    class="hero-media pointer-events-none absolute inset-0 h-full w-full object-cover"
    autoplay
    muted
    loop
    playsinline
    preload="metadata"
    tabindex="-1"
    aria-hidden="true"
    data-hero-video
  ></video>

  <div class="hero-video-grade pointer-events-none absolute inset-0" aria-hidden="true"></div>
  <div class="hero-text-shade pointer-events-none absolute inset-0" aria-hidden="true"></div>
  <div class="hero-grid pointer-events-none absolute inset-0" aria-hidden="true"></div>
  <div class="hero-chromatic-veil pointer-events-none absolute inset-0" aria-hidden="true"></div>
  <div class="hero-pointer-glow pointer-events-none absolute inset-0" aria-hidden="true"></div>
  <div class="hero-material-scan pointer-events-none absolute inset-y-0" aria-hidden="true"></div>

  <div class="hero-brand-orbit pointer-events-none absolute" aria-hidden="true">
    <span class="hero-brand-orbit__ring hero-brand-orbit__ring--red"></span>
    <span class="hero-brand-orbit__ring hero-brand-orbit__ring--blue"></span>
    <span class="hero-brand-orbit__axis"></span>
  </div>

  <div class="relative z-20 mx-auto flex w-full max-w-site flex-1 flex-col px-5 pb-7 pt-7 sm:px-8 sm:pb-9 lg:px-10 lg:pb-10 lg:pt-9">
    <div class="hero-utility-row flex items-start justify-between gap-6">
      <span class="hero-coordinate hidden font-heading text-[10px] font-semibold uppercase tracking-[0.16em] text-white/45 sm:block">
        R&amp;D&nbsp;&nbsp;/&nbsp;&nbsp;Production&nbsp;&nbsp;/&nbsp;&nbsp;Technical Service
      </span>
      <a
        class="hero-film-chip ml-auto flex items-center gap-4 px-4 py-3 text-[10px] font-semibold uppercase tracking-[0.14em] text-white/75 sm:text-[11px]"
        target="_blank"
        rel="noopener noreferrer"
        data-hero-film-link
      >
        <span class="hero-live-dot" aria-hidden="true"></span>
        <span data-hero-film-label></span>
        <span class="border-l border-white/20 pl-4 text-white/50" data-hero-film-duration></span>
      </a>
    </div>

    <div class="hero-stage flex flex-1 items-center py-7 sm:py-9 lg:py-8">
      <div class="hero-copy w-full">
        <p class="hero-eyebrow mb-5 flex items-center gap-3 text-[10px] font-semibold uppercase tracking-[0.18em] text-white/75 sm:mb-6 sm:text-xs">
          <span class="hero-eyebrow__line h-0.5 w-10 bg-brand-red" aria-hidden="true"></span>
          <span data-hero-eyebrow></span>
        </p>

        <h1 class="hero-title font-heading font-extrabold uppercase text-white" data-hero-title></h1>

        <div class="hero-detail-rail mt-7 grid gap-6 sm:mt-9 lg:grid-cols-12 lg:items-end lg:gap-8">
          <p class="hero-description max-w-[570px] text-sm leading-[1.7] text-white/76 sm:text-base lg:col-span-6" data-hero-description></p>

          <div class="hero-actions flex flex-wrap items-center gap-5 lg:col-span-6 lg:justify-end">
            <a
              class="hero-primary-cta inline-flex min-h-12 items-center justify-center bg-brand-red px-6 text-sm font-semibold text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-deep-blue"
              data-hero-primary-cta
            ></a>
            <a
              class="hero-secondary-cta group inline-flex min-h-11 items-center gap-3 border-b border-white/45 text-sm font-semibold text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-4 focus-visible:ring-offset-deep-blue"
              data-hero-secondary-cta
            >
              <span data-hero-secondary-label></span>
              <span class="hero-secondary-cta__arrow" aria-hidden="true">↘</span>
            </a>
          </div>
        </div>
      </div>
    </div>

    <div class="hero-index flex items-end justify-between border-t border-white/20 pt-4 text-[10px] font-semibold uppercase tracking-[0.16em] text-white/55 sm:text-[11px]">
      <a class="hero-scroll-link inline-flex items-center gap-3" href="#portfolio">
        <span class="hero-scroll-link__mark" aria-hidden="true"></span>
        <span>Scroll to explore</span>
      </a>
      <span class="hidden items-center gap-3 sm:flex">
        <span>Material</span>
        <span class="h-px w-7 bg-brand-red" aria-hidden="true"></span>
        <span>Application</span>
        <span class="h-px w-7 bg-brand-blue" aria-hidden="true"></span>
        <span>Proof</span>
      </span>
    </div>
  </div>
</section>
