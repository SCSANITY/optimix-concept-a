<!--
  CMS MAPPING
  - Copy and CTA labels → ACF Options Page: Homepage Hero
  - Hero loop, poster and full film → WordPress media fields
  - Glass composition and media behaviour → Fixed theme template behavior

  PRODUCTION NOTE
  - The supplied 03:43 corporate film remains available on demand.
  - The background uses a derived 19-second, muted loop to protect first-load performance.
  - Request the original 1080p master before production launch when available.
-->
<section
  class="hero-shell relative isolate -mt-20 flex min-h-[100svh] overflow-hidden bg-deep-blue pt-20 text-white"
  id="hero"
  data-hero
>
  <video
    class="hero-media pointer-events-none absolute inset-0 h-full w-full object-cover"
    autoplay
    muted
    loop
    playsinline
    preload="metadata"
    tabindex="-1"
    aria-hidden="true"
    data-hero-video
  ></video>

  <div class="hero-video-grade pointer-events-none absolute inset-0" aria-hidden="true"></div>
  <div class="hero-text-shade pointer-events-none absolute inset-0" aria-hidden="true"></div>
  <div class="hero-grid pointer-events-none absolute inset-0" aria-hidden="true"></div>

  <div class="relative z-20 mx-auto flex w-full max-w-site flex-1 flex-col px-5 pb-8 pt-8 sm:px-8 sm:pb-10 lg:px-10 lg:pb-12 lg:pt-10">
    <div class="flex justify-end">
      <div class="hero-film-chip flex items-center gap-4 px-4 py-3 text-[10px] font-semibold uppercase tracking-[0.14em] text-white/75 sm:text-[11px]">
        <span class="hero-live-dot" aria-hidden="true"></span>
        <span data-hero-film-label></span>
        <span class="border-l border-white/20 pl-4 text-white/50" data-hero-film-duration></span>
      </div>
    </div>

    <div class="flex flex-1 items-center py-8 lg:py-10">
      <div class="hero-glass-panel max-w-[590px] p-6 sm:p-8 lg:p-10">
        <p class="mb-5 flex items-center gap-3 text-[10px] font-semibold uppercase tracking-[0.17em] text-white/75 sm:text-xs">
          <span class="h-0.5 w-8 bg-brand-red" aria-hidden="true"></span>
          <span data-hero-eyebrow></span>
        </p>

        <h1
          class="font-heading text-[2.65rem] font-extrabold leading-[0.98] tracking-[-0.045em] text-white sm:text-[4rem] lg:text-[4.75rem]"
          data-hero-title
        ></h1>

        <p class="mt-6 max-w-[500px] text-base leading-[1.65] text-white/76 sm:text-lg" data-hero-description></p>

        <div class="mt-8 flex flex-wrap items-center gap-5">
          <a
            class="inline-flex min-h-12 items-center justify-center bg-brand-red px-6 text-sm font-semibold text-white transition-[background-color,transform] duration-300 hover:-translate-y-0.5 hover:bg-brand-red/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-deep-blue"
            data-hero-primary-cta
          ></a>
          <a
            class="group inline-flex min-h-11 items-center gap-3 border-b border-white/45 text-sm font-semibold text-white transition-colors hover:border-brand-red focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-4 focus-visible:ring-offset-deep-blue"
            target="_blank"
            rel="noopener noreferrer"
            data-hero-secondary-cta
          >
            <span class="grid h-7 w-7 place-items-center border border-white/30" aria-hidden="true">▶</span>
            <span data-hero-secondary-label></span>
          </a>
        </div>
      </div>
    </div>

    <div class="flex items-end justify-between border-t border-white/18 pt-5 text-[10px] font-semibold uppercase tracking-[0.16em] text-white/55 sm:text-[11px]">
      <span>Scroll to explore</span>
      <span class="hidden items-center gap-3 sm:flex">
        <span>Products</span>
        <span class="h-px w-7 bg-brand-red" aria-hidden="true"></span>
        <span>Projects</span>
        <span class="h-px w-7 bg-brand-blue" aria-hidden="true"></span>
        <span>Credentials</span>
      </span>
    </div>
  </div>
</section>
