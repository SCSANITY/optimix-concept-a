<!--
  CMS MAPPING
  - Archive introduction -> WordPress Page fields
  - Article cards -> CPT: news (title, date, category, excerpt, featured image)
  - Archive composition and filters -> Fixed theme template behavior
-->
<section class="news-archive bg-paper py-20 sm:py-24 lg:py-28" data-news>
  <div class="mx-auto max-w-site px-5 sm:px-8 lg:px-10">
    <div class="grid gap-8 border-b border-ink/15 pb-10 lg:grid-cols-12 lg:items-end lg:pb-14" data-reveal>
      <div class="lg:col-span-7">
        <p class="section-kicker"><span>01</span><span data-news-eyebrow></span></p>
        <h2 class="mt-5 max-w-[760px] font-heading text-4xl font-bold leading-[1.06] tracking-[-0.035em] text-ink sm:text-5xl lg:text-6xl" data-news-title></h2>
      </div>
      <p class="max-w-[520px] text-lg leading-[1.7] text-ink/66 lg:col-span-5" data-news-description></p>
    </div>

    <div class="mt-10 flex flex-wrap items-center justify-between gap-5" data-reveal>
      <div class="flex flex-wrap gap-2" data-news-filters aria-label="Filter news by category"></div>
      <p class="text-[11px] font-semibold uppercase tracking-[0.16em] text-ink/42"><span data-news-count></span> published stories</p>
    </div>

    <div class="mt-10 grid gap-x-6 gap-y-10 md:grid-cols-2 xl:grid-cols-3" data-news-list data-reveal></div>
  </div>
</section>
