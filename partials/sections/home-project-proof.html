<!--
  CMS MAPPING
  - Feature heading and selected project → ACF Options Page: Homepage Featured Project
  - Project details and image → CPT: project
  - Glass proof panel and image treatment → Fixed theme template behavior
-->
<section class="project-proof relative isolate min-h-[72svh] scroll-mt-20 overflow-hidden bg-deep-blue text-white" id="featured-project" data-home-project-proof>
  <img class="project-proof__image absolute inset-0 h-full w-full object-cover" alt="" data-project-proof-image>
  <div class="project-proof__grade pointer-events-none absolute inset-0" aria-hidden="true"></div>
  <div class="project-proof__grid pointer-events-none absolute inset-0" aria-hidden="true"></div>

  <div class="relative z-10 mx-auto flex min-h-[72svh] max-w-site flex-col justify-between px-5 py-10 sm:px-8 sm:py-12 lg:px-10 lg:py-14">
    <div class="flex items-center justify-between" data-reveal>
      <p class="flex items-center gap-3 text-[11px] font-semibold uppercase tracking-[0.17em] text-white/72">
        <span class="font-heading text-brand-red">02</span>
        <span class="h-px w-8 bg-white/35" aria-hidden="true"></span>
        <span data-project-proof-eyebrow></span>
      </p>
      <span class="hidden border border-white/25 bg-deep-blue/20 px-4 py-2 text-[10px] font-semibold uppercase tracking-[0.14em] text-white/65 backdrop-blur-md sm:block" data-project-proof-portfolio-label></span>
    </div>

    <div class="grid gap-8 lg:grid-cols-12 lg:items-end" data-reveal>
      <div class="lg:col-span-7">
        <h2 class="max-w-[760px] font-heading text-[2.5rem] font-bold leading-[1.02] tracking-[-0.04em] text-white sm:text-5xl lg:text-[4rem]" data-project-proof-title></h2>
      </div>

      <article class="project-proof__panel p-6 sm:p-7 lg:col-span-5 lg:p-8">
        <div class="flex items-start justify-between gap-5">
          <div>
            <p class="text-[10px] font-semibold uppercase tracking-[0.15em] text-white/55" data-project-proof-location></p>
            <h3 class="mt-3 font-heading text-2xl font-semibold leading-[1.12] tracking-[-0.025em] text-white" data-project-proof-name></h3>
          </div>
          <span class="font-heading text-xs font-bold tracking-[0.12em] text-brand-red">01 / 30</span>
        </div>

        <dl class="mt-6 grid grid-cols-2 gap-5 border-t border-white/18 pt-5">
          <div>
            <dt class="text-[9px] font-semibold uppercase tracking-[0.14em] text-white/45">Supply period</dt>
            <dd class="mt-2 text-sm text-white/80" data-project-proof-years></dd>
          </div>
          <div>
            <dt class="text-[9px] font-semibold uppercase tracking-[0.14em] text-white/45">Supplied products</dt>
            <dd class="mt-2 line-clamp-2 text-sm leading-[1.55] text-white/80" data-project-proof-products></dd>
          </div>
        </dl>

        <a class="mt-7 inline-flex min-h-11 items-center gap-3 border-b border-brand-red pb-1 text-sm font-semibold text-white transition-[gap,border-color] hover:gap-5 hover:border-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white" data-project-proof-cta>
          <span data-project-proof-cta-label></span>
          <span aria-hidden="true">→</span>
        </a>
      </article>
    </div>
  </div>
</section>
