<!--
  CMS MAPPING
  - Eyebrow, title, description, and proof counts → ACF Options Page: Homepage Credentials
  - Credential families → Taxonomy: credential_category
  - Credential register → CPT: credential (fields: title, subtitle, issuer, certificate_holder, valid_until, issued_on, document)
  - Group numbering, register layout, and responsive behavior → Fixed theme template behavior
-->
<section class="scroll-mt-24 bg-deep-blue py-20 text-white sm:py-24 lg:py-32" id="certifications" data-certifications>
  <div class="mx-auto max-w-site px-5 sm:px-8 lg:px-10">
    <div class="grid gap-8 lg:grid-cols-12 lg:items-end lg:gap-16" data-reveal>
      <div class="lg:col-span-7">
        <p class="mb-5 flex items-center gap-3 text-xs font-semibold uppercase tracking-[0.16em] text-white/70">
          <span class="font-heading text-brand-red">04</span>
          <span class="h-px w-8 bg-white/25" aria-hidden="true"></span>
          <span data-certifications-eyebrow></span>
        </p>
        <h2
          class="max-w-[760px] font-heading text-[2.125rem] font-bold leading-[1.12] tracking-[-0.025em] text-white sm:text-5xl lg:text-[3.25rem]"
          data-certifications-title
        ></h2>
      </div>
      <p class="max-w-[520px] text-lg leading-[1.7] text-white/70 lg:col-span-5" data-certifications-description></p>
    </div>

    <div class="mt-14 grid grid-cols-2 border-y border-white/20 lg:mt-20 lg:max-w-[560px]" data-reveal>
      <div class="py-6 pr-5 sm:pr-10">
        <p class="font-heading text-4xl font-bold tracking-[-0.03em] text-white" data-certifications-document-count></p>
        <p class="mt-2 text-[11px] font-semibold uppercase tracking-[0.14em] text-white/60" data-certifications-document-label></p>
      </div>
      <div class="border-l border-white/20 py-6 pl-5 sm:pl-10">
        <p class="font-heading text-4xl font-bold tracking-[-0.03em] text-white" data-certifications-family-count></p>
        <p class="mt-2 text-[11px] font-semibold uppercase tracking-[0.14em] text-white/60" data-certifications-family-label></p>
      </div>
    </div>

    <div class="mt-14 border-b border-white/20 lg:mt-20" data-credential-groups></div>
  </div>
</section>
