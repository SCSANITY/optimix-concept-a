<!--
  CMS MAPPING
  - Section copy → ACF Options Page: Homepage Portfolio Gateways
  - Gateway labels/images/links → ACF Repeater or selected archive pages
  - Expanding media stage → Fixed theme template behavior
-->
<section class="home-gateways relative overflow-hidden bg-paper py-14 sm:py-16 lg:py-20" id="portfolio" data-home-gateways>
  <div class="portfolio-stage__wordmark pointer-events-none absolute inset-x-0 top-0" aria-hidden="true">PORTFOLIO</div>

  <div class="relative mx-auto max-w-site px-5 sm:px-8 lg:px-10">
    <div class="portfolio-stage__intro grid gap-8 lg:grid-cols-12 lg:items-end lg:gap-12" data-reveal>
      <div class="lg:col-span-8">
        <p class="mb-4 flex items-center gap-3 text-[11px] font-semibold uppercase tracking-[0.17em] text-brand-blue">
          <span class="font-heading text-brand-red">01</span>
          <span class="h-px w-8 bg-ink/20" aria-hidden="true"></span>
          <span data-home-gateways-eyebrow></span>
        </p>
        <h2 class="portfolio-stage__title font-heading font-bold uppercase text-ink" data-home-gateways-title></h2>
      </div>
      <div class="lg:col-span-4 lg:pb-2">
        <p class="max-w-[500px] text-base leading-[1.7] text-ink/64" data-home-gateways-description></p>
        <p class="mt-6 flex items-center gap-3 text-[10px] font-semibold uppercase tracking-[0.16em] text-ink/45">
          <span class="h-2 w-2 bg-brand-red" aria-hidden="true"></span>
          <span data-gateway-active-label>01 / Project Portfolio</span>
        </p>
      </div>
    </div>

    <div class="gateway-canvas mt-10 sm:mt-12 lg:mt-14" data-home-gateways-list></div>

    <div class="portfolio-stage__footer mt-5 flex items-center justify-between gap-5 border-t border-ink/15 pt-4 text-[10px] font-semibold uppercase tracking-[0.15em] text-ink/48">
      <span>Three connected fields</span>
      <span class="hidden items-center gap-3 sm:flex">
        <span>Products</span>
        <span class="h-px w-8 bg-brand-red" aria-hidden="true"></span>
        <span>Projects</span>
        <span class="h-px w-8 bg-brand-blue" aria-hidden="true"></span>
        <span>Credentials</span>
      </span>
      <span class="sm:hidden">Swipe to explore</span>
    </div>
  </div>
</section>
