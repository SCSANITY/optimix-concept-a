<!--
  CMS MAPPING
  - Enquiry copy and verified contact details → ACF Options Page: Global Contact
  - Footer navigation → WordPress menu: Footer Navigation
  - Logo → WordPress custom logo
  - Compact composition → Fixed theme template behavior
-->
<footer class="bg-deep-blue text-white" id="contact" data-footer>
  <div class="mx-auto max-w-site px-5 sm:px-8 lg:px-10">
    <div class="grid gap-9 border-b border-white/15 py-12 sm:py-14 lg:grid-cols-12 lg:items-end lg:gap-12 lg:py-16" data-reveal>
      <div class="lg:col-span-8">
        <div class="flex items-center gap-5">
          <a
            class="inline-flex shrink-0 bg-paper p-2.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white"
            href="./index.html"
            aria-label="Optimix home"
          >
            <img class="h-auto w-24 object-contain sm:w-28" src="./assets/media/optimix-logo-official.png" width="900" height="600" alt="Optimix">
          </a>
          <p class="flex items-center gap-3 text-[10px] font-semibold uppercase tracking-[0.16em] text-white/55">
            <span class="h-0.5 w-7 bg-brand-red" aria-hidden="true"></span>
            <span data-footer-eyebrow></span>
          </p>
        </div>
        <h2 class="mt-7 max-w-[760px] font-heading text-[2.2rem] font-bold leading-[1.04] tracking-[-0.035em] text-white sm:text-5xl" data-footer-title></h2>
      </div>

      <div class="lg:col-span-4">
        <p class="max-w-[440px] text-sm leading-[1.7] text-white/65 sm:text-base" data-footer-description></p>
        <a class="mt-6 inline-flex min-h-11 items-center gap-3 bg-brand-red px-5 text-sm font-semibold text-white transition-transform hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white" data-footer-cta>
          <span data-footer-cta-label></span>
          <span aria-hidden="true">↗</span>
        </a>
      </div>
    </div>

    <div class="grid gap-8 border-b border-white/15 py-8 sm:grid-cols-2 lg:grid-cols-12 lg:items-start lg:gap-8" data-reveal>
      <div class="lg:col-span-3">
        <p class="text-[10px] font-semibold uppercase tracking-[0.15em] text-white/45" data-footer-office-label></p>
        <address class="mt-3 text-xs not-italic leading-[1.7] text-white/68" data-footer-address></address>
      </div>
      <dl class="space-y-2 lg:col-span-4" data-footer-contact-list></dl>
      <div class="sm:col-span-2 lg:col-span-5 lg:pl-6">
        <p class="text-[10px] font-semibold uppercase tracking-[0.15em] text-white/45" data-footer-navigation-label></p>
        <nav class="mt-3 flex flex-wrap gap-x-5 gap-y-2" aria-label="Footer navigation" data-footer-navigation></nav>
        <a class="mt-4 inline-flex items-center gap-2 text-xs font-semibold text-white/75 underline-offset-4 hover:text-white hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white" data-footer-locations-link>
          <span data-footer-locations-label></span>
          <span aria-hidden="true">→</span>
        </a>
      </div>
    </div>

    <div class="flex flex-col gap-2 py-5 text-[11px] text-white/45 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <p data-footer-legal-name></p>
        <p class="mt-1" data-footer-copyright></p>
      </div>
      <p>Design concept for review · Content subject to client approval</p>
    </div>
  </div>
</footer>
