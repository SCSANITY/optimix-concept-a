<!--
  CMS MAPPING
  - Enquiry heading, description, CTA, office label, address, and contact details → ACF Options Page: Global Contact
  - Footer navigation → WordPress menu: Footer Navigation
  - Logo → WordPress custom logo (temporary source: official supplied PNG)
  - Legal name → WordPress site option; copyright year → Theme template behavior
  - Layout and responsive behavior → Fixed theme template behavior
-->
<footer class="bg-deep-blue text-white" id="contact" data-footer>
  <div class="mx-auto max-w-site px-5 sm:px-8 lg:px-10">
    <div class="grid gap-9 border-b border-white/15 py-20 sm:py-24 lg:grid-cols-12 lg:items-end lg:gap-16 lg:py-28" data-reveal>
      <div class="lg:col-span-8">
        <p class="mb-5 flex items-center gap-3 text-xs font-semibold uppercase tracking-[0.16em] text-white/65">
          <span class="h-px w-8 bg-brand-red" aria-hidden="true"></span>
          <span data-footer-eyebrow></span>
        </p>
        <h2
          class="max-w-[820px] font-heading text-[2.25rem] font-bold leading-[1.08] tracking-[-0.03em] text-white sm:text-5xl lg:text-[3.75rem]"
          data-footer-title
        ></h2>
      </div>

      <div class="lg:col-span-4">
        <p class="max-w-[460px] text-base leading-[1.7] text-white/70 sm:text-lg" data-footer-description></p>
        <a
          class="mt-7 inline-flex min-h-12 items-center gap-3 rounded-brand bg-brand-red px-6 text-sm font-semibold text-white transition-[background-color,transform] duration-300 hover:-translate-y-0.5 hover:bg-brand-red/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-4 focus-visible:ring-offset-deep-blue"
          data-footer-cta
        >
          <span data-footer-cta-label></span>
          <span aria-hidden="true">↗</span>
        </a>
      </div>
    </div>

    <div class="grid gap-12 py-12 sm:py-16 lg:grid-cols-12 lg:gap-8" data-reveal>
      <div class="lg:col-span-5">
        <a
          class="inline-flex rounded-brand bg-paper p-3 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-4 focus-visible:ring-offset-deep-blue"
          href="#hero"
          aria-label="Optimix home"
        >
          <img
            class="h-auto w-36 object-contain sm:w-40"
            src="./assets/media/optimix-logo-official.png"
            width="900"
            height="600"
            alt="Optimix"
          >
        </a>
        <p class="mt-6 max-w-[340px] text-sm leading-[1.7] text-white/55" data-footer-legal-name></p>
      </div>

      <div class="sm:grid sm:grid-cols-2 sm:gap-10 lg:col-span-4 lg:block">
        <div>
          <p class="text-[11px] font-semibold uppercase tracking-[0.16em] text-white/55" data-footer-office-label></p>
          <address class="mt-5 text-sm not-italic leading-[1.75] text-white/75" data-footer-address></address>
        </div>
        <dl class="mt-8 space-y-4 sm:mt-0 lg:mt-8" data-footer-contact-list></dl>
      </div>

      <div class="lg:col-span-3 lg:pl-8">
        <p class="text-[11px] font-semibold uppercase tracking-[0.16em] text-white/55" data-footer-navigation-label></p>
        <nav class="mt-5 grid grid-cols-2 gap-x-6 gap-y-3 sm:max-w-[320px] lg:grid-cols-1" aria-label="Footer navigation" data-footer-navigation></nav>
        <a
          class="mt-8 inline-flex items-center gap-2 text-sm font-semibold text-white underline-offset-8 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-4 focus-visible:ring-offset-deep-blue"
          target="_blank"
          rel="noopener noreferrer"
          data-footer-locations-link
        >
          <span data-footer-locations-label></span>
          <span aria-hidden="true">↗</span>
        </a>
      </div>
    </div>

    <div class="flex flex-col gap-2 border-t border-white/15 py-6 text-xs text-white/55 sm:flex-row sm:items-center sm:justify-between">
      <p data-footer-copyright></p>
      <p>Design concept for review</p>
    </div>
  </div>
</footer>
